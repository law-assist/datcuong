networks:
  law-dev-network:
    driver: bridge

services:
  database:
    image: mongo
    restart: always
    command: --port 27017
    ports:
      - "27018:27017"
    volumes:
      - law-dev-database:/data/db
    networks:
      - law-dev-network
  vector-db:
    image: chromadb/chroma
    restart: always
    volumes:
      - law-dev-vectordb:/data
    ports:
      - "8001:8000"
    networks:
      - law-dev-network
  frontend:
    image: lawassist/frontend:dev-latest
    pull_policy: always
    volumes:
      - .:/workspace:cached
      - frontend-dev-node-module:/workspace/FE/node_modules
    environment:
      - NEXT_PUBLIC_API_HOST=http://localhost:29003
      - NEXTAUTH_URL=http://localhost:29002/
    command: sleep infinity
    network_mode: service:backend
  backend:
    image: lawassist/backend:dev-latest
    pull_policy: always
    volumes:
      - .:/workspace:cached
      - backend-dev-node-module:/workspace/BE/node_modules
    depends_on:
      - database
    environment:
      - MONGODB_URI=mongodb://database:27017/law_linking
      - AI_HOST=http://ai-law-linking:8000/reference_matching/id_input
    command: sleep infinity
    networks: 
      - law-dev-network
  ai-law-linking:
    image: lawassist/ai-law-linking:dev-latest
    pull_policy: always
    volumes:
      - .:/workspace:cached
    depends_on:
      - database
    environment:
      - DATABASE_URI=mongodb://database:27017/law_linking
    command: sleep infinity
    networks: 
      - law-dev-network
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all # alternatively, use `count: all` for all GPUs
              capabilities: [gpu]
  ai-chatbot:
    image: lawassist/ai-chatbot:dev-latest
    pull_policy: always
    volumes:
      - .:/workspace:cached
    depends_on:
      - database
    environment:
      - MONGO_URI=mongodb://database:27017/
    command: sleep infinity
    networks: 
      - law-dev-network

volumes:
  law-dev-database: # Persistent storage for MongoDB
  law-dev-vectordb: # Persistent storage for ChromaDB
  frontend-dev-node-module:
  backend-dev-node-module:
